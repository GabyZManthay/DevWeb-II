<div class="card">

  <div class="card-image">
    <img [src]="product.image" [alt]="product.title">
  </div>

  <div class="card-body">

    <h3>
      {{ product.title }}
    </h3>

    <p class="price">
      $ {{ product.price }}
    </p>

    <a
      class="btn"
      [routerLink]="['/produto', product.id]">
      View Product
    </a>

  </div>

</div>
