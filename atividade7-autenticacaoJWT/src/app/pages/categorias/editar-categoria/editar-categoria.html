<div class="container py-4">
  <div class="page-header mb-4">
    <h1>Editar Categoria</h1>
    <p class="text-muted">Simulação de edição de categoria com canDeactivate.</p>
  </div>

  <form>
    <input class="form-control mb-3" placeholder="Nome" [(ngModel)]="nome" name="nome" (ngModelChange)="markAlterado()">
    <textarea class="form-control mb-3" placeholder="Descrição" [(ngModel)]="descricao" name="descricao" (ngModelChange)="markAlterado()"></textarea>
    <button type="button" class="btn btn-warning" (click)="salvar()">Salvar</button>
  </form>
</div>
